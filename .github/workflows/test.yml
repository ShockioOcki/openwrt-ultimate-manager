name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  syntax-and-converters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Build and syntax checks
        run: ./tests/syntax.sh
      - name: Converter fixtures
        run: ./tests/test_sources.sh
      - name: Device policy YAML
        run: ruby ./tests/test_policy_yaml.rb
      - name: Subscription metadata
        run: ./tests/test_subscription_info.sh
      - name: Speed-test YAML
        run: ruby ./tests/test_speedtest_yaml.rb
