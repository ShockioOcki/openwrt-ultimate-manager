name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  syntax-and-converters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Build and syntax checks
        run: ./tests/syntax.sh
      - name: Converter fixtures
        run: ./tests/test_sources.sh
      - name: Device policy YAML
        run: ruby ./tests/test_policy_yaml.rb
      - name: Subscription metadata
        run: ./tests/test_subscription_info.sh
      - name: Login routing
        run: ./tests/test_login_default.sh
      - name: OUM integration contracts
        run: ./tests/test_contracts.sh
      - name: Backup codec
        run: ruby ./tests/test_backup_codec.rb
      - name: Russia routing and game exclusions
        run: ruby ./tests/test_russia_routing.rb
      - name: Installer dependency and USB decisions
        run: python3 ./tests/test_install_dependencies.py
      - name: Routing selection and progress
        run: |
          node ./tests/test_podkop_selection.js
          node ./tests/test_routing_progress.js
          node ./tests/test_mobile_dns.js
